[package]
name = "air-transfer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "air-transfer"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
# Core (shared across native + wasm)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reed-solomon-erasure = "6.0"
zstd = "0.13"
postcard = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-v4l", "input-avfoundation", "input-msmf"] }
pixels = "0.15"
winit = "0.30"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "HtmlInputElement",
    "HtmlElement",
    "ImageData",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaDevices",
    "Navigator",
    "Window",
    "Document",
    "Element",
    "Event",
    "File",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Response",
    "console",
    "DomRect",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
serde-wasm-bindgen = "0.6"
