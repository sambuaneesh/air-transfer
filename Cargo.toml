[package]
name = "air-transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
nokhwa = { version = "0.10.11", features = ["input-v4l", "input-avfoundation", "input-msmf"] }
pixels = "0.15"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reed-solomon-erasure = "6.0"
zstd = "0.13"
postcard = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
